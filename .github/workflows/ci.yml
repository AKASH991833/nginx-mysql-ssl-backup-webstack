name: CI
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nginx, MariaDB, logrotate, shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx mariadb-server openssl diffutils rsync logrotate shellcheck curl openssl
          sudo systemctl stop nginx mariadb || true      # the tests start their own private instances
      - name: ShellCheck
        run: shellcheck -S error -x wsk tests/run.sh tests/run-apache.sh tests/env.sh tests/env-apache.sh tests/env-db.sh
      - name: Integration tests (real nginx + real MariaDB, unprivileged ports)
        run: tests/run.sh
  real-server:
    # Full root install on a clean Ubuntu VM: systemd, apt, real ports 80/443.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo ./wsk install
      - run: sudo ./wsk init-site lab.example.test --self-signed
      - run: sudo systemctl reload nginx
      - run: sudo ./wsk backup && sudo ./wsk verify
      - run: sudo ./wsk restore-test
      - run: sudo ./wsk dr-drill --max-rto 120
      - run: sudo ./wsk health
      - run: sudo ./wsk certs
      - run: sudo ./wsk logrotate
      - run: sudo ./wsk timers --apply && sudo ./wsk timers --check && sudo ./wsk guard health 120 health && sudo ./wsk timers --status
  rhel-family:
    # Same checks across the Red Hat family: Rocky, AlmaLinux, CentOS Stream, Fedora,
    # and Red Hat UBI 9 (the free official Red Hat image - not a RHEL subscription).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # UBI 9 is intentionally absent: the free UBI repos ship the MariaDB client
        # but no mariadb-server package, so this suite cannot run there without a RHEL subscription.
        distro: [rocky-9, alma-9, centos-stream-9, fedora-latest]
        include:
          - {distro: rocky-9,          image: rockylinux:9}
          - {distro: alma-9,           image: almalinux:9}
          - {distro: centos-stream-9,  image: quay.io/centos/centos:stream9}
          - {distro: fedora-latest,    image: fedora:latest}
    container: ${{ matrix.image }}
    steps:
      - name: Install packages (dnf)
        run: dnf install -y -q git nginx mariadb-server mariadb openssl diffutils rsync logrotate hostname procps-ng findutils gawk which iproute
      - uses: actions/checkout@v4
      - name: Integration tests on ${{ matrix.distro }}
        run: tests/run.sh
  compose-lab:
    # The container lab is real: build it, probe HTTP/TLS/headers, write rows, run the
    # backup sidecar, then restore the dump into a scratch database and count the rows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the lab
        run: |
          cd examples
          openssl rand -base64 24 > db_password.txt
          openssl rand -base64 24 > db_root_password.txt
          ./gen-certs.sh
          docker compose up -d --wait
      - name: HTTP/TLS behaviour
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 301
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/)" = 200
          curl -skI https://localhost:8443/ | grep -qi 'x-content-type-options: nosniff'
          ! curl -skI https://localhost:8443/ | grep -qi 'nginx/[0-9]'
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/.env)" = 403
      - name: Backup, then prove the dump restores
        run: |
          cd examples
          docker compose exec -T db sh -c 'mariadb -uroot -p"$(cat /run/secrets/db_root_password)" -e "CREATE TABLE IF NOT EXISTS shop.visits(path VARCHAR(50)); INSERT INTO shop.visits VALUES ('"'"'/a'"'"'),('"'"'/b'"'"'),('"'"'/c'"'"');"'
          docker compose exec -T backup /backup.sh
          docker compose exec -T db sh -c 'mariadb -uroot -p"$(cat /run/secrets/db_root_password)" -e "DROP TABLE shop.visits;"'
          f=$(ls -t backups/shop-*.sql.gz | head -1)
          docker compose exec -T db sh -c 'mariadb -uroot -p"$(cat /run/secrets/db_root_password)" -e "CREATE DATABASE restorecheck"'
          zcat "$f" | docker compose exec -T db sh -c 'mariadb -uroot -p"$(cat /run/secrets/db_root_password)" restorecheck'
          n=$(docker compose exec -T db sh -c 'mariadb -uroot -p"$(cat /run/secrets/db_root_password)" -N -e "SELECT COUNT(*) FROM restorecheck.visits"')
          echo "restored rows: $n"
          test "$n" = 3
          docker compose exec -T db sh -c 'mariadb -uroot -p"$(cat /run/secrets/db_root_password)" -e "DROP DATABASE restorecheck"'
      - name: Tear down
        if: always()
        run: cd examples && docker compose down -v
  debian:
    # The full real-nginx + real-MariaDB suite on Debian 12 (bookworm, oldstable)
    # and Debian 13 (trixie, stable) - apt path, nginx as www-data by default.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [debian-12, debian-13]
        include:
          - {distro: debian-12, image: debian:12}
          - {distro: debian-13, image: debian:13}
    container: ${{ matrix.image }}
    steps:
      - name: Install packages (apt)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git nginx mariadb-server openssl diffutils rsync logrotate hostname procps curl ca-certificates
      - uses: actions/checkout@v4
      - name: Integration tests on ${{ matrix.distro }}
        run: tests/run.sh
  apache:
    # The Apache (httpd) scenario suite - real httpd + real MariaDB - on
    # Debian 12/13 (apache2), Rocky 9 (httpd) and Ubuntu 24.04 (apache2).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [debian-12, debian-13, rocky-9, ubuntu-24.04]
        include:
          - {distro: debian-12,    image: debian:12,    pm: apt}
          - {distro: debian-13,    image: debian:13,    pm: apt}
          - {distro: rocky-9,      image: rockylinux:9, pm: dnf}
          - {distro: ubuntu-24.04, image: ubuntu:24.04, pm: apt}
    container: ${{ matrix.image }}
    steps:
      - name: Install packages (apt)
        if: matrix.pm == 'apt'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git apache2 mariadb-server openssl diffutils rsync procps curl ca-certificates
      - name: Install packages (dnf)
        if: matrix.pm == 'dnf'
        run: dnf install -y -q git httpd mod_ssl mariadb-server mariadb openssl diffutils rsync procps-ng hostname
      - uses: actions/checkout@v4
      - name: Apache scenario suite on ${{ matrix.distro }}
        run: tests/run-apache.sh
