# Lab version: the same stack in containers (nginx + MariaDB + a backup sidecar).
# UNTESTED in the author's sandbox (no Docker there) - the host version (./wsk) is the tested one.
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: shop
      MARIADB_USER: shop_app
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [dbdata:/var/lib/mysql]
    healthcheck: { test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 10s, retries: 10 }
  web:
    image: nginx:stable-alpine
    ports: ["8080:80", "8443:443"]
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: { db: { condition: service_healthy } }
  backup:
    image: mariadb:10.11
    entrypoint: ["/bin/sh", "-c", "while true; do mariadb-dump -h db -u shop_app -p\"$$(cat /run/secrets/db_password)\" --single-transaction shop | gzip > /backups/shop-$$(date +%F).sql.gz; find /backups -mtime +7 -delete; sleep 86400; done"]
    secrets: [db_password]
    volumes: [./backups:/backups]
    depends_on: [db]
secrets:
  db_password:
    file: ./db_password.txt        # create it yourself: openssl rand -base64 24 > db_password.txt
volumes:
  dbdata:
