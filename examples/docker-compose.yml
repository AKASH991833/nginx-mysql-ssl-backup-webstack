# Lab version of the wsk stack in containers: nginx (TLS, security headers) + MariaDB
# + a backup sidecar whose dumps are proven restorable.
# This lab is exercised end-to-end on every push by the "compose-lab" job in
# .github/workflows/ci.yml (start, HTTP/TLS checks, backup, real restore into a scratch DB).
# How to run it yourself: see examples/README.md
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_DATABASE: shop
      MARIADB_USER: shop_app
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password, db_root_password]
    volumes: [dbdata:/var/lib/mysql]
    healthcheck: { test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 5s, retries: 24 }
  web:
    image: nginx:stable-alpine
    ports: ["8080:80", "8443:443"]
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: { db: { condition: service_healthy } }
  backup:
    image: mariadb:10.11
    # one backup at start, then one every 24h; run "docker compose exec backup /backup.sh" any time
    entrypoint: ["/bin/sh", "-c", "/backup.sh && while true; do sleep 86400; /backup.sh; done"]
    secrets: [db_password]
    volumes: [./backups:/backups, ./backup.sh:/backup.sh:ro]
    depends_on: { db: { condition: service_healthy } }
secrets:
  db_password:       # create it: openssl rand -base64 24 > db_password.txt
    file: ./db_password.txt
  db_root_password:  # create it: openssl rand -base64 24 > db_root_password.txt
    file: ./db_root_password.txt
volumes:
  dbdata:
